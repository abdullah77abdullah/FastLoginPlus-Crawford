name: Build Jar

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          # Gradle runs on 25; the classic modules use the 21 toolchain.
          java-version: |
            21
            25
          cache: 'gradle'

      # The ProtocolSupport library comes from JitPack, which sometimes cannot serve it.
      # Ask for it a few times; if it never shows up the next step removes the optional
      # ProtocolSupport integration so the jar still builds (ProtocolLib keeps working).
      - name: Check ProtocolSupport on JitPack
        id: ps
        run: |
          URL="https://jitpack.io/com/github/ProtocolSupport/ProtocolSupport/master-66b494a8dd-1/ProtocolSupport-master-66b494a8dd-1.jar"
          for i in 1 2 3 4 5 6; do
            code=$(curl -sL -m 120 -o /dev/null -w '%{http_code}' "$URL" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "available=false" >> "$GITHUB_OUTPUT"

      - name: Remove ProtocolSupport integration (JitPack jar unavailable)
        if: steps.ps.outputs.available != 'true'
        run: |
          python3 - <<'PY'
          import pathlib, re, shutil, sys

          root = pathlib.Path('.')
          src = root / 'bukkit/src/main/java/com/github/games647/fastlogin/bukkit'
          main = src / 'FastLoginBukkit.java'
          text = main.read_text(encoding='utf-8')
          text, n1 = re.subn(
              r'^import com\.github\.games647\.fastlogin\.bukkit\.listener\.protocolsupport\.ProtocolSupportListener;\r?\n',
              '', text, flags=re.M)
          text, n2 = re.subn(
              r'if \(pluginManager\.isPluginEnabled\("ProtocolSupport"\)\) \{\s*'
              r'pluginManager\.registerEvents\(new ProtocolSupportListener\(this, antiBotService\), this\);\s*'
              r'\} else if \(',
              'if (', text)
          if n1 != 1 or n2 != 1:
              sys.exit(f'Could not patch FastLoginBukkit.java (import={n1}, branch={n2})')
          main.write_text(text, encoding='utf-8')
          shutil.rmtree(src / 'listener/protocolsupport')

          gradle = root / 'gradle/platform-common.gradle'
          g = gradle.read_text(encoding='utf-8')
          g, n3 = re.subn(
              r'^[ \t]*compileOnly\(libs\.protocol\.support\) \{ transitive = false \}\r?\n',
              '', g, flags=re.M)
          if n3 != 1:
              sys.exit('Could not patch gradle/platform-common.gradle')
          gradle.write_text(g, encoding='utf-8')
          print('ProtocolSupport integration removed from the Bukkit build')
          PY

      - name: Build Bukkit jar
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: bash ./gradlew :bukkit:shadowJar -x test --no-daemon --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: FastLoginPlus-Bukkit
          path: |
            bukkit/build/libs/*.jar
            !bukkit/build/libs/*-plain.jar
          if-no-files-found: error
